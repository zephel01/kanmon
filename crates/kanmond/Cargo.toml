[package]
name = "kanmond"
description = "kanmon 監視デーモン（第1弾：ポーリング収集・遮断なし）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kanmon-core = { path = "../kanmon-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
ureq.workspace = true
clap.workspace = true
pcap = { version = "2", optional = true }
# N3：DNS の答えの IP が、そのドメインの正しい証明書を出すかを確かめる（ureq と同じ rustls を使う）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows：Sysmon の購読・接続の一覧・名前付きパイプ・サービス・レジストリ・イベントログ
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_EventLog",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }
windows-service = "0.8"
winreg = "0.56"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[features]
default = ["capture"]
# DNS・SNI の受け身の観測（libpcap が必要。Linux では libpcap-dev）
capture = ["dep:pcap"]

# Linux のパッケージ（cargo-deb・cargo-generate-rpm）。リリースのときに CI で作る
[package.metadata.deb]
name = "kanmon"
maintainer = "kanmon contributors"
copyright = "kanmon contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "Per-process network monitor for developer machines (observe and notify only)."
section = "net"
priority = "optional"
depends = "libpcap0.8t64 | libpcap0.8, libc6 (>= 2.35)"
maintainer-scripts = "../../packaging/linux/debian"
assets = [
  ["target/release/kanmond", "usr/sbin/", "755"],
  ["target/release/kanmonctl", "usr/bin/", "755"],
  ["../../packaging/linux/kanmond.service", "lib/systemd/system/", "644"],
  ["../../packaging/kanmon.toml", "etc/kanmon/kanmon.toml", "644"],
  ["../../detections/*.yaml", "etc/kanmon/detections/", "644"],
  ["../../README.md", "usr/share/doc/kanmon/", "644"],
]

[package.metadata.generate-rpm]
name = "kanmon"
summary = "Per-process network monitor (observe and notify only)"
assets = [
  { source = "target/release/kanmond", dest = "/usr/sbin/kanmond", mode = "755" },
  { source = "target/release/kanmonctl", dest = "/usr/bin/kanmonctl", mode = "755" },
  { source = "../../packaging/linux/kanmond.service", dest = "/usr/lib/systemd/system/kanmond.service", mode = "644" },
  { source = "../../packaging/kanmon.toml", dest = "/etc/kanmon/kanmon.toml", mode = "644", config = "noreplace" },
  { source = "../../detections/*.yaml", dest = "/etc/kanmon/detections/", mode = "644", config = true },
  { source = "../../README.md", dest = "/usr/share/doc/kanmon/README.md", mode = "644", doc = true },
]
post_install_script = "../../packaging/linux/debian/postinst"
pre_uninstall_script = "../../packaging/linux/rpm-preun"

[package.metadata.generate-rpm.requires]
libpcap = "*"

