[package]
name = "kanmond"
description = "kanmon 監視デーモン（第1弾：ポーリング収集・遮断なし）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kanmon-core = { path = "../kanmon-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
ureq.workspace = true
clap.workspace = true
libc.workspace = true
pcap = { version = "2", optional = true }

[features]
default = ["capture"]
# DNS・SNI の受け身の観測（libpcap が必要。Linux では libpcap-dev）
capture = ["dep:pcap"]
