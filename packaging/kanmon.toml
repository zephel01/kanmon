# kanmon 設定（第1弾：監視のみ）。省略した項目は既定値。
# Linux 既定パス：/etc/kanmon/kanmon.toml   macOS：/Library/Application Support/kanmon/etc/kanmon.toml

# learning：導入直後（ベースライン作成、warn 以上だけ通知）／ observe：通常
mode = "learning"
learning_days = 7
# ポーリング間隔。短いほど短命接続を拾えるが CPU を使う
interval_ms = 500

# data_dir = "/var/lib/kanmon"
# detections_dir = "/etc/kanmon/detections"
# rules_file = "/etc/kanmon/rules.json"

# root 実行時、検知ルール・許可ルール・拒否リストは「root 所有かつ他者書込不可」でなければ読まない
strict_owner = true
include_loopback = false
retention_days = 90
beacon_report_min = 0.6
beacon_interval_s = 300
# 状態ソケット（読み取り専用、メニューバーアプリ用）。空文字で無効
# status_socket = "/var/run/kanmond.sock"   # Linux 既定は /run/kanmon/kanmond.sock
# status_allowed_uids = []
feeds_refresh_hours = 24
# local_blocklists = ["/etc/kanmon/blocklist.txt"]


[thresholds]
notice = 30
warn = 60
critical = 100

[jsonl]
# path = "/var/log/kanmon/events.jsonl"
max_mb = 50
keep = 5
# "size"（サイズごと：events.jsonl.1 … .keep）/ "daily"（日付ごと：events.YYYY-MM-DD.jsonl、keep_days 日残す）
rotate = "size"
keep_days = 30

# kanmond の動作ログ。macOS の既定は /Library/Logs/kanmon/kanmond.log（日付ごとに kanmond.YYYY-MM-DD.log）。
# Linux の既定は空（標準エラー → journald）
[log]
# path = "/var/log/kanmon/kanmond.log"
keep_days = 14

[notify]
local = true
min_level = "notice"
dedup_minutes = 10
# 例：ntfy_url = "https://ntfy.sh"、ntfy_topic は推測されにくい名前に
ntfy_url = ""
ntfy_topic = ""
ntfy_token = ""
# 死活監視（healthchecks.io / Uptime Kuma の push URL 等）。途絶を外側で検知させる
heartbeat_url = ""
heartbeat_minutes = 5
# このレベル以上は、閉じるまで残るダイアログ（macOS）／期限なし通知（Linux）で全文を表示
alert_level = "warn"
alert_timeout_s = 600
# メニューバーアプリ（Kanmon.app）が動いている間は、ダイアログ・バナーをアプリに任せる
defer_to_app = true

[[feeds]]
name = "feodo"
url = "https://feodotracker.abuse.ch/downloads/ipblocklist.txt"

[[feeds]]
name = "spamhaus_drop_v4"
url = "https://www.spamhaus.org/drop/drop_v4.json"

# 宛先の名前付け（DNS 応答・TLS の SNI を受け身で読む。DNS の設定は変えない）と DNS の改ざん検知
[dns]
enabled = true
# interfaces = []                 # 空なら自動（Linux は any、macOS は稼働中の全インターフェース）
# hosts_path = "/etc/hosts"
# resolv_conf = ["/etc/resolv.conf", "/run/systemd/resolve/resolv.conf"]
check_interval_s = 60
# 監視リストのドメインだけ、暗号化 DNS（DoH、https のみ）で引き直して照合する
crosscheck = true
doh_url = "https://cloudflare-dns.com/dns-query"
crosscheck_interval_min = 30
# watch_domains = ["registry.npmjs.org", "pypi.org", "github.com", ...]   # 既定値は docs/detections.md
# 社内ドメインなど、プライベート IP に解決されても知らせない接尾辞
# private_ok_suffixes = ["corp.example.co.jp"]

# 送信量（プロセス × 宛先）。直近 window_s 秒の合計が min_report_kb 以上なら報告し、検知ルール（55-volume.yaml）で判定する
[volume]
enabled = true
interval_s = 10
window_s = 600
min_report_kb = 1024
report_every_min = 30

# 居座り（開発ツールの設定・自動起動への仕込み）の走査。読むだけで、実行・変更はしない
[persistence]
enabled = true
# ~/ はログイン中のユーザーのホーム。node_modules・target 等は潜らない
roots = ["~/kanmon-work"]
interval_s = 3600
max_depth = 6
# /Library/LaunchDaemons・/etc/systemd/system 等、システム全体の自動起動も見る
system = true
