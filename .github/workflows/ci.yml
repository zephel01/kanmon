name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: libpcap（DNS・SNI の観測に使う）
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libpcap-dev
      - name: 導入スクリプト（launchd の入れ替え）の確認
        if: runner.os == 'Linux'
        run: |
          shellcheck -x -S warning packaging/launchd-lib.sh packaging/install-macos.sh packaging/install-linux.sh packaging/build-check.sh macos/install-app.sh tests/harness/launchd_lib_test.sh tests/harness/build_check_test.sh
          tests/harness/launchd_lib_test.sh
          tests/harness/build_check_test.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # Linux のパッケージを作り、実際にコンテナに入れて確かめる（リリースと同じ作り方）
  package-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libpcap-dev
      - run: cargo build --release -p kanmond -p kanmonctl
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: bash .github/scripts/build-linux-packages.sh deb
      - name: Ubuntu 22.04・24.04・Debian 12 に入れる
        run: |
          for img in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "== $img"
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/.github/scripts:/s:ro" "$img" sh /s/check-installed.sh deb
          done

  package-rpm:
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: ビルドに要るもの（libpcap-devel は CRB にある）
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y gcc libpcap-devel git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p kanmond -p kanmonctl
      - run: cargo install --locked cargo-generate-rpm
      - run: bash .github/scripts/build-linux-packages.sh rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  package-rpm-install:
    needs: package-rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist
      - name: Fedora・AlmaLinux 9 に入れる
        run: |
          for img in fedora:latest almalinux:9; do
            echo "== $img"
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/.github/scripts:/s:ro" "$img" sh /s/check-installed.sh rpm
          done

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftUI のマクロを使っていないか（Command Line Tools ではビルドできないため）
        run: |
          if grep -rnE '@State[[:space:]]|@State$|@Observable|@Bindable|#Preview' macos/KanmonBar/Sources; then
            echo "SwiftUI のマクロは使えません（CLAUDE.md 参照）"; exit 1
          fi
      - name: Swift のテスト（kanmond との JSON の取り決め）
        run: cd macos/KanmonBar && swift test
      - name: Kanmon.app（メニューバーアプリ）をビルド
        run: bash macos/build-app.sh
      - name: バンドルの中身を確認
        run: |
          plutil -p macos/build/Kanmon.app/Contents/Info.plist
          file macos/build/Kanmon.app/Contents/MacOS/KanmonBar
          test -s macos/build/Kanmon.app/Contents/Resources/AppIcon.icns
